name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Pin uv to the interpreter this job set up, rather than whatever
      # `python3` uv happens to discover on PATH.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      # v7 across the board, matching the sibling projects. checkout@v4 and
      # setup-python@v5 target Node 20, which GitHub deprecated on
      # 2025-09-19 and now force-runs on Node 24 with an annotation on every
      # job; v6+ is where Node 24 landed, and v7 is taken for the runway.
      # Nothing here uses an input these majors changed: checkout is called
      # with no inputs, and setup-python only with `python-version`.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      # python-rtmidi publishes no cp313 wheel, so on 3.13 uv builds it from
      # sdist, and on Linux that needs the ALSA headers. macOS and Windows
      # link against CoreMIDI and WinMM and need nothing here.
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run checks
        run: uv run --no-sync make check