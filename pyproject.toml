[build-system]
# >=77 for PEP 639: the SPDX ``license`` expression and ``license-files``
# above are only understood from there, and an older setuptools either
# refuses the string or writes the licence into the metadata wrongly --
# which for a GPL distribution is the part that must be exact.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vinsynlib"
# One source of truth. `__version__` is what `is_compatible_version` checks
# and what the tools' entry points compare against, so a version here that
# could drift from the module is the one number that must not be written
# twice -- and a change that added API without changing it is exactly what
# left p2ked crashing against a library it thought it could use.
dynamic = ["version"]
description = "Shared base for ROMpler instrument browsers: settings, favourites, banks, dumps, CLI and key conventions"
readme = "README.md"
requires-python = ">=3.11"

# SPDX expression and the file that carries it, rather than the old
# `license = { text = ... }` table. The table form is deprecated, and it
# cannot express that COPYING and the per-file notices are part of the
# distribution -- which for a GPL project is the point of the metadata.
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "COPYING"]

keywords = ["midi", "synthesizer", "sampler", "textual", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# Deliberately empty. The shared layer is stdlib-only so that any tool in
# the family can depend on it -- including ones with no terminal UI, and
# ones that do not use Textual. Textual arrives through the `ui` extra,
# which only `vinsynlib.ui` needs.
dependencies = []

# Both dependencies are deliberately optional. A project with no terminal
# UI uses this library without ever importing `vinsynlib.ui`, and the
# projects that do use `vinsynlib.midi` all depend on python-rtmidi
# themselves -- a project that forgets gets a clear `MidiUnavailable`
# rather than an ImportError, which is the point of importing rtmidi
# lazily.
[project.optional-dependencies]
ui = ["textual>=0.80"]
midi = ["python-rtmidi>=1.5"]

[project.urls]
Homepage = "https://github.com/lentferj/vinsynlib"
Source = "https://github.com/lentferj/vinsynlib"
Issues = "https://github.com/lentferj/vinsynlib/issues"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "detect-secrets>=1.5.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "setuptools>=83",
    "textual>=0.80",
    "vulture>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vinsynlib*"]

[tool.setuptools.dynamic]
version = {attr = "vinsynlib.__version__"}

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
# The Textual widget tests drive a real App, so they are async. There is
# nothing here that needs a marker per test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["vinsynlib"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "SIM", "UP", "C4", "PL", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Rules ruff cannot auto-fix, suppressed per file. `S101` (assert) is
# allowed in tests by design.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415", "RUF012"]
# The lazy rtmidi import is the point: an offline command must work on a
# machine with no MIDI stack at all. `install_clean_exit` swallows
# deliberately: a handler that fails while tearing down must not replace
# the failure the user was already being told about.
#
# PLR0913: `open_remembered_or_swept` takes one keyword per step of the
# policy -- what to try, what to sweep with, what was remembered, whether
# to ignore it, where to record the answer, how to report progress. Six
# keyword-only arguments that each say one thing beats a policy object
# with six fields that each say one thing.
"src/vinsynlib/midi.py" = ["PLC0415", "SIM105", "S110", "PLR0913"]
# `add_common_arguments` is a keyword-only bag of "does this tool have the
# concept", one keyword per flag in the spec. Splitting it up would mean
# splitting the spec.
"src/vinsynlib/cli.py" = ["PLR0913"]
"src/vinsynlib/devchecks.py" = ["PLR2004"]
# Long SQL literals and long row lookups: the alternative is a line-broken
# query string that cannot be compared against the schema by eye. `S608`
# is a false positive here -- nothing user-supplied is interpolated, and
# the only ORDER BY is validated against a fixed set of clauses first.
"src/vinsynlib/favorites.py" = ["E501", "PLR0913", "PLR2004", "S608"]
# `ord(char) < 0x20` is the space, and a constant named for it would be
# named nothing.
"src/vinsynlib/config.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["rtmidi", "textual", "textual.*"]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]

# DEP001/DEP002: `rtmidi` is imported lazily inside
# `vinsynlib.midi._rtmidi()` -- so it is neither a hard dependency (DEP001)
# nor detectable as a used one (DEP002) -- and it is an optional extra.
# See the comment on `[project.optional-dependencies]` above.
[tool.deptry.per_rule_ignores]
DEP001 = ["rtmidi"]
DEP002 = ["python-rtmidi"]